# Configuration des outils de développement (pas de paquet à installer).

[tool.ruff]
line-length = 110
target-version = "py310"
extend-include = ["*.pyw"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
platform = "win32"
strict = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
